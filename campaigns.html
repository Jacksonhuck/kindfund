
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explore Campaigns - KindFund</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #202938;
}

header {
  background: white;
  padding: 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 2px 8px #ddd;
}

.logo {
  color: #155eef;
  font-size: 23px;
  font-weight: bold;
}

header a {
  color: #155eef;
  text-decoration: none;
  font-weight: bold;
}

.hero {
  text-align: center;
  padding: 40px 15px;
  background: #eaf1ff;
}

.hero h1 {
  color: #155eef;
  font-size: 30px;
}

.hero p { color: #555; }

.container {
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

#campaigns {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 20px;
}

.campaign {
  background: white;
  padding: 20px;
  border-radius: 12px;
  box-shadow: 0 2px 10px #ddd;
}

.campaign h3 { color: #155eef; }

.campaign p {
  line-height: 1.5;
  overflow-wrap: anywhere;
}

button {
  background: #155eef;
  color: white;
  padding: 12px 18px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

footer {
  text-align: center;
  padding: 25px;
  color: #777;
}
</style>
</head>

<body>

<header>
  <div class="logo">KindFund ❤️</div>
  <a href="create-campaign.html">Start a Fundraiser</a>
</header>

<section class="hero">
  <h1>Help Someone Today</h1>
  <p>Discover campaigns. Share hope. Make a difference.</p>
  <a href="create-campaign.html">
    <button>Start Fundraising</button>
  </a>
</section>

<div class="container">
  <h2>Explore Fundraisers</h2>
  <p>Support people and causes around the world.</p>

  <div id="campaigns">
    Loading campaigns...
  </div>
</div>

<footer>
  © 2026 KindFund. Connecting people through kindness.
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const supabaseClient = window.supabase.createClient(
  "https://niiqklhmnhhzrxozijpf.supabase.co",
  "sb_publishable_KdHO7x3i_uK0G_J1cvwiQg_srZDptUX"
);

async function loadCampaigns() {

  const container = document.getElementById("campaigns");

  const { data, error } = await supabaseClient
    .from("campaigns")
    .select("id,title,story,goal_amount,currency,country")
    .eq("status", "published")
    .order("created_at", { ascending: false });

  if (error) {
    container.textContent =
      "Unable to load campaigns. Please try again later.";
    return;
  }

  if (!data || data.length === 0) {
    container.textContent =
      "No published campaigns yet. Be the first to start one!";
    return;
  }

  container.innerHTML = "";

  data.forEach(campaign => {

    const card = document.createElement("div");
    card.className = "campaign";

    const title = document.createElement("h3");
    title.textContent = campaign.title;

    const story = document.createElement("p");
    story.textContent =
      campaign.story.substring(0, 180) + "...";

    const country = document.createElement("p");
    country.textContent = "📍 " + (campaign.country || "");

    const goal = document.createElement("p");
    goal.textContent =
      "Goal: " + campaign.currency + " " +
      Number(campaign.goal_amount).toLocaleString();

    const button = document.createElement("button");
    button.textContent = "View Campaign";
    button.addEventListener("click", () => {
      window.location.href =
        "campaign.html?id=" +
        encodeURIComponent(campaign.id);
    });

    card.append(title, story, country, goal, button);
    container.appendChild(card);

  });
}

loadCampaigns();
</script>

</body>
</html>
